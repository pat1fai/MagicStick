name: MagicStick
version: '${version}'
main: com.magic.magicStick.MagicStick
api-version: '26.3'
load: POSTWORLD

commands:
  getstick:
    description: Выдает стихийную волшебную палочку (Земля, Воздух, Огонь, Вода)
    aliases:
      - magicstick
      - stick
    usage: /<command> [игрок] [dirt|wind|fire|water]
    permission: magicstick.use

permissions:
  magicstick.use:
    description: Разрешает получение волшебной палочки
    default: true
